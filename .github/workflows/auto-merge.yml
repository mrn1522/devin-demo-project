name: Auto-merge Devin PRs

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize, closed]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'devin-ai-integration[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Arm auto-merge only — GitHub merges once every required check and
        # required review is satisfied. No direct-merge fallback: a privileged
        # merge here could bypass checks that are still pending.
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

  cleanup-branch:
    # GitHub's "Automatically delete head branches" does not reliably fire for
    # merges performed by the auto-merge executor, so delete explicitly.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # Structured GraphQL variables: the branch name is never interpolated
          # into an API path, so any valid git ref name is safe.
          CURRENT_SHA=$(gh api graphql --jq '.data.repository.ref.target.oid // ""' \
            -f o="$OWNER" -f n="$REPO" -f r="refs/heads/$HEAD_REF" -f query='
              query($o: String!, $n: String!, $r: String!) {
                repository(owner: $o, name: $n) { ref(qualifiedName: $r) { target { oid } } }
              }')

          # The repo's auto-delete setting may have already removed the branch.
          if [ -z "$CURRENT_SHA" ]; then
            echo "Branch $HEAD_REF already deleted."
            exit 0
          fi

          # Only delete the exact ref instance that was merged: if the branch
          # name was recreated with new commits, it is not ours to remove.
          if [ "$CURRENT_SHA" != "$HEAD_SHA" ]; then
            echo "Branch $HEAD_REF now points at $CURRENT_SHA (merged $HEAD_SHA); leaving it."
            exit 0
          fi

          # Atomic compare-and-delete: the lease is rejected if the ref moved
          # between our check and the delete, so a recreated branch survives.
          if ! PUSH_OUT=$(git push origin --delete --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" "refs/heads/$HEAD_REF" 2>&1); then
            if echo "$PUSH_OUT" | grep -qE "stale info|does not exist"; then
              echo "Branch $HEAD_REF changed or was deleted concurrently; leaving it."
              exit 0
            fi
            echo "$PUSH_OUT" >&2
            exit 1
          fi
          echo "Deleted merged branch $HEAD_REF."

  sweep-stale-branches:
    # pull_request.closed never fires for merges executed by the auto-merge
    # executor: the merge runs as github-actions[bot], and events caused by a
    # GITHUB_TOKEN-initiated action don't trigger workflows. Sweep on a
    # schedule to catch the devin/* branches that cleanup-branch misses.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete devin/* branches whose PRs merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # Grace period: a freshly merged branch may still get a new PR opened
          # against it; only sweep merges older than this.
          CUTOFF=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          BRANCHES=$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --paginate \
            --jq '.[].name | select(startswith("devin/"))')
          if [ -z "$BRANCHES" ]; then
            echo "No devin/* branches."
            exit 0
          fi

          # Counts open PRs tied to $BRANCH. --paginate walks every page and
          # head=$OWNER: narrows server-side to the owner's repos; the
          # full_name check pins results to this repository (a same-named
          # branch in the owner's fork would otherwise match). Command
          # substitutions propagate gh failures through set -e.
          live_prs() {
            OPEN_COUNT=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" --paginate \
              -f state=open -f "head=$OWNER:$BRANCH" -f per_page=100 \
              --jq '.[] | select(.head.repo.full_name == "'"$GITHUB_REPOSITORY"'") | .number' \
              | wc -l)
            DEPENDENT_COUNT=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" --paginate \
              -f state=open -f "base=$BRANCH" -f per_page=100 \
              --jq '.[].number' | wc -l)
          }

          while IFS= read -r BRANCH; do
            CURRENT_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
            if [ -z "$CURRENT_SHA" ]; then
              continue
            fi

            # Keep branches with live PRs on them or based on them.
            live_prs
            if [ "$OPEN_COUNT" -gt 0 ] || [ "$DEPENDENT_COUNT" -gt 0 ]; then
              continue
            fi

            # Deletable only if this commit was the head of a merged
            # same-repository PR merged before the grace window. headRefName
            # can match same-named branches in forks, so rows are filtered by
            # headRepository; --paginate follows pageInfo through every page
            # (REST commits/{sha}/pulls can't be used: a squash-merged head is
            # not a commit in this repository and the endpoint rejects it).
            MATCHED=0
            MERGED_ROWS=$(gh api graphql --paginate \
              --jq '.data.repository.merged.nodes[] | [.headRefOid, .mergedAt, .headRepository.nameWithOwner] | @tsv' \
              -f o="$OWNER" -f n="$REPO" -f b="$BRANCH" -f query='
                query($o: String!, $n: String!, $b: String!, $endCursor: String) {
                  repository(owner: $o, name: $n) {
                    merged: pullRequests(headRefName: $b, states: [MERGED], first: 50, after: $endCursor) {
                      nodes { headRefOid mergedAt headRepository { nameWithOwner } }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }')
            while IFS=$'\t' read -r PR_SHA PR_AT PR_REPO; do
              if [ "$PR_REPO" = "$GITHUB_REPOSITORY" ] && [ "$PR_SHA" = "$CURRENT_SHA" ] && [[ "$PR_AT" < "$CUTOFF" ]]; then
                MATCHED=1
                break
              fi
            done <<< "$MERGED_ROWS"
            if [ "$MATCHED" -eq 0 ]; then
              continue
            fi

            # Recheck immediately before deleting — a PR opened since the first
            # query does not move the ref, so the lease alone can't see it.
            live_prs
            if [ "$OPEN_COUNT" -gt 0 ] || [ "$DEPENDENT_COUNT" -gt 0 ]; then
              echo "Branch $BRANCH gained an open PR; leaving it."
              continue
            fi

            if ! PUSH_OUT=$(git push origin --delete --force-with-lease="refs/heads/$BRANCH:$CURRENT_SHA" "refs/heads/$BRANCH" 2>&1); then
              if echo "$PUSH_OUT" | grep -qE "stale info|does not exist"; then
                echo "Branch $BRANCH changed concurrently; leaving it."
                continue
              fi
              echo "$PUSH_OUT" >&2
              exit 1
            fi
            echo "Deleted $BRANCH (merged at $CURRENT_SHA)."

            # Recovery: if a PR materialized inside the check-delete race
            # window, recreate the ref via the API. The shallow checkout lacks
            # CURRENT_SHA as a local object, so `git push SHA:` cannot work;
            # POST /git/refs also fails atomically if the ref already exists.
            sleep 2
            live_prs
            if [ "$OPEN_COUNT" -gt 0 ] || [ "$DEPENDENT_COUNT" -gt 0 ]; then
              if ! RESTORE_OUT=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f "ref=refs/heads/$BRANCH" -f "sha=$CURRENT_SHA" 2>&1); then
                if echo "$RESTORE_OUT" | grep -q "already exists"; then
                  echo "Branch $BRANCH was recreated concurrently."
                else
                  echo "$RESTORE_OUT" >&2
                  exit 1
                fi
              else
                echo "Restored $BRANCH at $CURRENT_SHA — an open PR referenced it."
              fi
            fi
          done <<< "$BRANCHES"
